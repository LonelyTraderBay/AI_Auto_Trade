[project]
name = "ai-auto-trade"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
ai-auto-trade = "ai_auto_trade.apps.cli.entrypoint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "ruff==0.16.1",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "hypothesis==6.165.2",
  "import-linter==2.13",
  "jsonschema==4.26.0",
  "sqlalchemy==2.0.41",
  "alembic==1.16.2",
  "asyncpg==0.30.0",
  "psycopg2-binary==2.9.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E", "W", "F",
  "I",
  "UP",
  "B",
  "C90",
  "PL",
  "ERA",
  "SIM",
  "ANN",
  "D",
  "PGH",
  "RUF",
]

ignore = ["D104"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"migrations/**" = ["D", "ANN", "ERA"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src", "tests"]
exclude = ["migrations"]

[tool.alembic]
script_location = "migrations"
sqlalchemy.url = "postgresql+psycopg2://aat_dev:changeme_local@localhost:5432/ai_auto_trade_dev"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
