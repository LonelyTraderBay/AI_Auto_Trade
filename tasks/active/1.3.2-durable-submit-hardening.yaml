impact:
  database: true
  api: false
  event: true
  config: false
  dependency: false
  security: true
acceptance_criteria:
  - "A SERIALIZABLE TradingSubmissionUnitOfWork persists approved risk decision/reservation, execution order, first submission attempt, immutable lifecycle event and platform outbox/delivery state atomically before any venue call."
  - "The application boundary rejects expired or mismatched risk approval/reservation and fails closed when the kill switch or lease/fencing precondition is invalid."
  - "Replay by venue/account/client_order_id and request hash returns the canonical prior result without a second side effect; a hash conflict is a deterministic contract failure."
  - "UNKNOWN and TIMEOUT are durably linked to reconciliation evidence and cannot trigger a blind resubmit; only an explicit reconciliation path can advance recovery."
  - "Duplicate or out-of-order lifecycle/fill/outbox delivery evidence is deduplicated by the approved constraints/CAS path; partial progression never resubmits the order."
  - "Fault-injection tests cover crash-after-commit, crash-after-apply-before-ack, duplicate outbox publish/consume, lease loss and restart/recovery with zero duplicate order effects."
  - "Domain/application code remains framework/vendor independent at the domain boundary and preserves Decimal, UTC and UUIDv7 rules."
  - "No external network, credential, API, migration, dependency, ledger or AI execution path is introduced."
  - "All required quality, contract, PostgreSQL no-skip, secret and allowlist checks pass with evidence."
required_commands:
  - "uv sync --locked"
  - "uv run ruff format --check ."
  - "uv run ruff check ."
  - "uv run pyright"
  - "uv run pytest"
  - "uv run pytest tests/integration/test_task_1_3_2_postgres.py -q"
  - "uv run pytest tests/integration -q"
  - "uv run python scripts/validate_contracts.py"
  - "git diff --check"
evidence_path: "docs/governance/evidence/tasks/1.3.2/"
gate_impact: "Phase 1 local core-safety hardening only; does not open Phase 3, external venue, ledger or AI gates."
rollback_or_forward_fix: "Revert only the task commits if review rejects behavior; preserve immutable order/event/audit history and use an approved forward-fix migration/ADR if a schema gap is discovered."
known_risks:
  - "Fencing protects internal claim/write safety but cannot prove an external-looking request was not received; UNKNOWN remains reconciliation-bound."
  - "The existing Task 1.3 migration is treated as approved input; schema changes are out of scope and require a separate approved task/ADR."
  - "Fault-injection evidence must remain deterministic and secret-free."
waiver_id: null
