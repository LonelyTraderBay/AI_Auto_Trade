  database: false
  api: false
  event: false
  config: false
  dependency: false
  security: true
acceptance_criteria:
  - "The target evidence file contains no credential-like PostgreSQL DSN with a username/password, API key, private key or other secret value."
  - "The historical procedure remains understandable and executable when DATABASE_URL is supplied out-of-band; the value is never printed, logged, committed or copied into evidence."
  - "The redaction report records the exact target path, affected line, before/after file hashes, redaction rationale, owner/reviewer roles and UTC decision without reproducing the removed value."
  - "A repository diff/secret scan finds no new high-confidence secret pattern in the cleanup diff; known local placeholders are explicitly classified and are not expanded in scope."
  - "The cleanup diff contains only files in the canonical cleanup card allowlist and passes the required quality commands."
  - "The task ends at REVIEW at most; Account Owner decides whether it is DONE."
required_commands:
  - "uv sync --locked"
  - "uv run ruff format --check ."
  - "uv run ruff check ."
  - "uv run pyright"
  - "uv run pytest"
  - "uv run python scripts/validate_contracts.py"
  - "git diff --check"
evidence_path: "docs/governance/evidence/tasks/1.3.1/"
gate_impact: "Security evidence cleanup only; does not open Task 1.3, Phase 3, external venue, ledger or AI gates."
rollback_or_forward_fix: "Restore prior evidence wording only through an approved forward-fix/reviewed commit if the redaction procedure loses required meaning; never restore a credential-like value."
known_risks:
  - "Redaction changes the evidence file hash; provenance must be preserved by recording before/after hashes and reviewer decision without retaining the sensitive value in new artifacts."
  - "A repository-wide scan may find other historical placeholders or credential-like strings outside this card; report them and create separate scoped cleanup tasks rather than broadening this task silently."
  - "This task does not prove runtime secret safety; it only removes one evidence-boundary leak and records verification."
waiver_id: null
