goal: "Redact the credential-like PostgreSQL DSN from the historical Task 0.3 evidence report while preserving the documented procedure, provenance, audit trail and safe out-of-band DATABASE_URL usage."
non_goals:
  - "No change to Task 1.3 runtime implementation, domain logic, tests or migrations."
  - "No secret discovery, printing, storage, rotation or connection to an external service."
  - "No change to PostgreSQL, Supabase, Docker, deployment, venue, ledger or AI runtime configuration."
  - "No deletion or rewriting of Git history; preserve the original evidence through normal repository history and a redaction report."
  - "No self-approval of this task, Task 1.3, an ADR, a gate, a waiver or a security decision."
preconditions:
  - "Account Owner approval is recorded; Security/Backup Owner role action must be recorded before editing the target evidence."
  - "A separate branch matching task/1.3.1-* is checked out before changing the target evidence file."
  - "The exact target is docs/governance/evidence/tasks/0.3/persistence-evidence.md; no other historical evidence file is silently broadened into scope."
  - "The redaction report records target path, affected line, before/after SHA-256 and reviewer decision without reproducing the credential-like value."
  - "The replacement procedure uses DATABASE_URL supplied out-of-band and does not echo or persist its value."
blockers: []
allowed_globs:
  - "docs/governance/evidence/tasks/0.3/persistence-evidence.md"
  - "docs/governance/evidence/tasks/1.3.1/**"
  - "docs/governance/DOCS_INDEX.md"
  - "tasks/active/1.3.1-evidence-secret-redaction.yaml"
