    ControlScope:
      type: object
      additionalProperties: false
      required: [scope_type, account_id, instrument_id, strategy_instance_id]
      properties:
        scope_type:
          type: string
          enum: [GLOBAL, ACCOUNT, INSTRUMENT, STRATEGY]
        account_id:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/UuidV7'
        instrument_id:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/UuidV7'
        strategy_instance_id:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/UuidV7'
    ReconciliationCommandRequest:
      type: object
      additionalProperties: false
      required: [reason, payload]
      description: >-
        HTTP input only. The server derives actor identity, route scope, command ID,
        request hash and ACCEPTED status, then persists C-CMD-001.
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1024
        payload:
          type: object
          additionalProperties: false
          required: [scope, evidence_cutoff_at]
          properties:
            scope:
              $ref: '#/components/schemas/ControlScope'
            evidence_cutoff_at:
              $ref: '#/components/schemas/Timestamp'
    StrategyActivationCommandRequest:
      type: object
      additionalProperties: false
      required: [reason, payload]
      description: HTTP input mapped by the server to ACTIVATE_STRATEGY in C-CMD-001.
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1024
        payload:
          $ref: '#/components/schemas/StrategyCommandPayload'
    StrategyStopCommandRequest:
      type: object
      additionalProperties: false
      required: [reason, payload]
      description: HTTP input mapped by the server to STOP_STRATEGY in C-CMD-001.
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1024
        payload:
          $ref: '#/components/schemas/StrategyCommandPayload'
    StrategyCommandPayload:
      type: object
      additionalProperties: false
      required: [strategy_instance_id, deployment_id]
      properties:
        strategy_instance_id:
          $ref: '#/components/schemas/UuidV7'
        deployment_id:
          $ref: '#/components/schemas/UuidV7'
    KillSwitchActivationCommandRequest:
      type: object
      additionalProperties: false
      required: [reason, payload]
      description: HTTP input mapped by the server to ACTIVATE_KILL_SWITCH in C-CMD-001.
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1024
        payload:
          type: object
          additionalProperties: false
          required: [scope, activation_reason_code]
          properties:
            scope:
              $ref: '#/components/schemas/ControlScope'
            activation_reason_code:
              type: string
              pattern: '^[A-Z][A-Z0-9_]*$'
    KillSwitchReleaseCommandRequest:
      type: object
      additionalProperties: false
      required: [reason, payload]
      description: >-
        HTTP input mapped by the server to RELEASE_KILL_SWITCH in C-CMD-001. The
        re-authentication proof is a protected header and approval evidence is
        recorded server-side; neither is supplied as a body identity claim.
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1024
        payload:
          type: object
          additionalProperties: false
          required: [kill_switch_id, scope, verification_evidence_ref]
          properties:
            kill_switch_id:
              $ref: '#/components/schemas/UuidV7'
            scope:
              $ref: '#/components/schemas/ControlScope'
            verification_evidence_ref:
              type: string
              minLength: 1
              maxLength: 2048
    BacktestCommandRequest:
      type: object
      additionalProperties: false
      required: [reason, payload]
      description: HTTP input mapped by the server to START_BACKTEST in C-CMD-001.
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1024
        payload:
          type: object
          additionalProperties: false
          required: [dataset_version, strategy_version, seed]
          properties:
            dataset_version:
              type: string
              minLength: 1
            strategy_version:
              type: string
              minLength: 1
            seed:
              type: integer
              minimum: 0
