# CI workflow — Task 0.2
# Runs bootstrap command profile on every PR and push to main.
# Does NOT deploy, does NOT use real credentials, does NOT connect to venues.
# Task-ID: 0.2 | Refs: ADR-0014, NFR-OPS-001

name: CI

on:
  push:
    branches: [main, "task/**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.32"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Tests
        run: uv run pytest

      - name: Contract validation
        run: uv run python scripts/validate_contracts.py
